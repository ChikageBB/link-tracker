spring:
  liquibase:
    enabled: true
    change-log: file:../migrations/changelog-master.xml
  jpa:
    hibernate:
      ddl-auto: none

app:
  access-type: ORM
  github:
    base-url: ${github.base-url:https://api.github.com}
    token: ${GITHUB_TOKEN}
  stackoverflow:
    base-url: ${stackoverflow.base-url:https://api.stackexchange.com/2.3}
    key: ${STACKOVERFLOW_KEY:test-key}
    access-token: ${STACKOVERFLOW_ACCESS_KEY:test-token}
  scheduler:
    interval: 60000
    batch-size: 100
    thread-count: 4
  kafka:
    topic:
      name: link-updates
      partitions: 1
      replicas: 1
      min-insync-replicas: 1
      schema-registry-url: mock://test
  outbox:
    interval: 1000
  communication:
    type: http
clients:
  bot:
    base-url: http://localhost:8080
    connect-timeout: 5s
    read-timeout: 5s
  scrapper:
    base-url: http://localhost:8081
    connect-timeout: 5s
    read-timeout: 5s
