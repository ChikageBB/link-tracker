syntax = "proto3";

option java_multiple_files = true;
option java_package = "chikagebb.linktracker.scrapper.grpc";
option java_outer_classname = "UpdateServiceProto";

package update;

service UpdateService {
    rpc SendUpdate (SendUpdateRequest) returns (SendUpdateResponse);
}

message SendUpdateRequest {
    int64 id = 1;
    string url = 2;
    string description = 3;
    repeated int64 tg_chat_ids = 4;
}

message SendUpdateResponse {
    string status = 1;
}
